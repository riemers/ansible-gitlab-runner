gitlab_runner_runners:
  - name: 'Example Docker GitLab Runner'
    token: abcd
    executor: docker
    docker_pull_policy: always
    docker_image: "alpine"
    docker_privileged: true
    docker_disable_cache: false
    docker_shm_size: 0
    output_limit: 32768
    tags:
      - docker
      - privileged
    docker_volumes:
      - /cache
    autoscaler:
      plugin: aws
      capacity_per_instance: 1
      max_use_count: 1
      max_instances: 1
      plugin_config:
        name: example-asg
      connector_config:
        username: ubuntu
      policies:
        - idle_count: 0
    extra_configs:
      runners.autoscaler:
        instance_ready_command: "cloud-init status --wait"
